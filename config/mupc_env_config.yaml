# MUPC 环境配置文件
# 用法: python train.py --config config/mupc_env_config.yaml
# 修改此文件可调整所有物理常量、动作空间、奖励阈值，无需改动代码

# ═══════════════════════════════════════════════════════════════
# 物理常量 (SAFETY: 修改前请评审)
# ═══════════════════════════════════════════════════════════════
physical:
  transformer_kva: 200.0         # 变压器额定容量 (kVA)
  battery_capacity_kwh: 100.0     # 电池容量 (kWh)
  p_batt_max_kw: 50.0            # 最大充放电功率 (kW)
  q_batt_max_kvar: 300.0         # 最大无功输出 (kVar)
  load_shed_max_kw: 60.0         # 最大切负荷 (kW) [与负荷峰值匹配]
  pv_array_kw: 150.0             # 光伏容量 (kW)
  load_peak_kw: 60.0             # 负荷峰值 (kW)

# ═══════════════════════════════════════════════════════════════
# 安全约束 (SAFETY: 硬约束，不可突破)
# ═══════════════════════════════════════════════════════════════
safety:
  soc_min: 0.10                  # SOC 下限硬约束
  soc_max: 0.90                  # SOC 上限硬约束
  overload_threshold: 0.85       # 过载阈值 (变压器额定容量百分比)
  battery_charge_efficiency: 0.90  # 充电效率 (锂离子电池典型值 90%)
  battery_discharge_efficiency: 0.90  # 放电效率 (锂离子电池典型值 90%)

# ═══════════════════════════════════════════════════════════════
# 时间参数
# ═══════════════════════════════════════════════════════════════
time:
  dt_hours: 0.25                 # 时间步长 (15分钟 = 0.25小时)
  episode_length: 96              # 每天步数 (96 × 15分钟 = 24小时)
  load_pf: 0.90                  # 负荷功率因数 cosφ
  demand_window_steps: 4         # 需量滑动窗口步数 (4步×15分钟=1小时)

# ═══════════════════════════════════════════════════════════════
# 合同与排放
# ═══════════════════════════════════════════════════════════════
contract:
  contract_demand_kw: 300.0      # 合同需量 (kW)
  grid_emission_factor: 0.581     # kg CO2/kWh

# ═══════════════════════════════════════════════════════════════
# 电压仿真 (VoltageSimulator 简化模型)
# ═══════════════════════════════════════════════════════════════
voltage_simulator:
  k_p: 0.05                      # 有功灵敏度 (p.u. / S_BASE)
  k_q: 0.03                      # 无功灵敏度 (p.u. / S_BASE)
  s_base: 500.0                  # 基准功率 (kVA)
  v_min: 0.85                    # 电压下限 (p.u.)
  v_max: 1.15                    # 电压上限 (p.u.)
  noise_std: 0.005               # 测量噪声标准差
  imbalance: 0.003               # 三相不平衡度
  impedance_drift_pct: 0.10       # 动态阻抗扰动 ±10%（模拟线路老化/温度变化）
  harmonic_3rd_pct: 0.03          # 3次谐波 3% 幅值（农网配电侧谐波污染）
  harmonic_5th_pct: 0.02          # 5次谐波 2% 幅值

# ═══════════════════════════════════════════════════════════════
# Q_batt 电压环控制 (实时控制核心)
# ═══════════════════════════════════════════════════════════════
q_control:
  k_q: 200.0                     # 无功-电压灵敏度系数 (kVar/p.u.)

# ═══════════════════════════════════════════════════════════════
# 奖励阈值配置
# ═══════════════════════════════════════════════════════════════
reward_thresholds:
  voltage_deadband: 0.05          # ±5% 死区
  q_margin_threshold: 0.10        # 实时模块无功耗尽阈值 (10%)
  voltage_high_limit: 1.05        # 弃光前置电压阈值 (p.u.)
  soc_critical: 0.10             # SOC 极低保护阈值
  voltage_penalty_high: 2.0      # 高电压侧惩罚系数 (光伏超发)
  voltage_penalty_low: 1.0       # 低电压侧惩罚系数 (灌溉/炒茶/空调)

# ═══════════════════════════════════════════════════════════════
# 动作约束 (ActionValidator)
# ═══════════════════════════════════════════════════════════════
action_constraints:
  p_batt_max: 50.0               # kW（匹配电池最大放电功率）
  s_max: 200.0                   # kVA (功率圆上限，匹配变压器容量)
  load_shed_max: 60.0            # kW（匹配负荷峰值）
  delta_p_max: 50.0              # kW/步（电池变化率保护）

# ═══════════════════════════════════════════════════════════════
# 动作空间定义（归一化空间，RL 输出范围）
# ═══════════════════════════════════════════════════════════════
action_space:
  p_batt_norm_min: -1.0           # p_batt 归一化下限 → 物理值 [-50, 50] kW
  p_batt_norm_max: 1.0            # p_batt 归一化上限
  load_shed_norm_min: 0.0         # load_shedding 归一化下限 → [0, 60] kW
  load_shed_norm_max: 1.0          # load_shedding 归一化上限
  pv_limit_min: 0.0               # 光伏限功率比例下限 (无量纲)
  pv_limit_max: 1.0               # 光伏限功率比例上限

# ═══════════════════════════════════════════════════════════════
# 观测空间归一化参数（与 reward_thresholds.VOLTAGE_* 联动）
# ═══════════════════════════════════════════════════════════════
obs_normalization:
  d1_pv_range: [0.0, 150.0]      # D1 光伏归一化范围 (匹配 pv_array_kw)
  d1_load_range: [0.0, 60.0]      # D1 负荷归一化范围 (匹配 load_peak_kw)
  d1_power_range: [-500.0, 500.0] # D1 功率归一化范围
  d1_voltage_range: [0.85, 1.15]  # D1 电压归一化范围
  d5_irradiance_range: [0.0, 1500.0] # D5 辐照归一化范围
  d5_temp_range: [-20.0, 60.0]    # D5 温度归一化范围
  d6_dispatch_range: [-500.0, 500.0] # D6 调度归一化范围

# ═══════════════════════════════════════════════════════════════
# 场景奖励权重 (MODE-01~MODE-05)
# ═══════════════════════════════════════════════════════════════
reward_weights:
  MODE-01: [1.0, 0.5, 2.0, 1.0, 0.5]    # w1(光伏消纳), w2(电池), w3(过载), w4(电压质量), w5(变化率), w6(电压斜率)
  MODE-02: [1.0, 1.0, 2.0]               # w1(价差), w2(电池), w3(过载)
  MODE-03: [1.0, 0.5]                     # w1(需量减免), w2(舒适度)
  MODE-04: [1.0, 2.0, 1.0]                # w1(辅助收益), w2(响应精度), w3(延迟)
  MODE-05: [1.0, 1.0]                     # w1(绿电), w2(碳减排)

# ═══════════════════════════════════════════════════════════════
# 通信延迟模拟（逼 AI 学到容忍 RTU 轮询延迟的策略）
# ═══════════════════════════════════════════════════════════════
comm:
  action_delay_steps_min: 1        # 最小延迟步数（1步=15分钟）
  action_delay_steps_max: 3        # 最大延迟步数（模拟 RTU 轮询周期 15~45min）